{% extends 'base.html' %}
{% block title %}Ingresar | SportZone{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="container py-5">
    <div class="auth-card mx-auto">
      <div class="auth-heading"><span class="auth-icon"><i class="fa-solid fa-right-to-bracket"></i></span><div><h1>Iniciar sesión</h1><p>Accede a tus pedidos y finaliza tus compras.</p></div></div>
      <form method="post" class="mt-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label">Correo electrónico</label><input class="form-control form-control-lg" type="email" name="email" autocomplete="email" required></div>
        <div class="mb-4"><label class="form-label">Contraseña</label><div class="password-wrap"><input class="form-control form-control-lg" id="loginPassword" type="password" name="password" autocomplete="current-password" required><button type="button" class="password-toggle" data-target="loginPassword"><i class="fa-solid fa-eye"></i></button></div></div>
        <button class="btn btn-primary btn-lg w-100 fw-bold" type="submit">Ingresar</button>
      </form>
      <p class="text-center mt-4 mb-0">¿No tienes una cuenta? <a href="{{ url_for('register') }}">Regístrate</a></p>
    </div>
  </div>
</section>
{% endblock %}
